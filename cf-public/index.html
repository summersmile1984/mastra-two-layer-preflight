<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grok 风格 · 两层 Agent</title>
<style>
:root{--bg:#fff;--side:#f6f6f7;--line:#e7e7ea;--fg:#111;--mut:#6b6b74;--me:#111;--meFg:#fff;--bot:#f1f1f3;--acc:#2563eb;--card:#fafafa}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0f;--side:#141417;--line:#26262b;--fg:#ececf1;--mut:#9a9aa5;--me:#ececf1;--meFg:#111;--bot:#1c1c21;--acc:#60a5fa;--card:#16161a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:flex}
aside{width:280px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}
aside h1{font-size:17px;margin:18px 18px 8px}.sec{font-size:12px;color:var(--mut);margin:14px 18px 6px}
.item{display:flex;gap:10px;align-items:center;padding:9px 14px;margin:0 8px;border-radius:12px;cursor:pointer}.item:hover,.item.on{background:var(--line)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;flex:none;background:var(--fg);color:var(--bg);position:relative}
.av.l2{background:var(--acc);color:#fff}.av .dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#22c55e;border:2px solid var(--side)}
.av .dot.busy{background:#f59e0b;animation:p 1s infinite}@keyframes p{50%{opacity:.35}}
.nm{font-weight:600;font-size:14px}.ds{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}header .ds{max-width:none}
#thread{flex:1;overflow:auto;padding:24px 0}.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.row{display:flex;margin:10px 0;gap:10px}.row.me{justify-content:flex-end}
.b{max-width:78%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word}
.me .b{background:var(--me);color:var(--meFg);border-bottom-right-radius:6px}.bot .b{background:var(--bot);border-bottom-left-radius:6px}
.row .av{width:28px;height:28px;font-size:12px}
.task{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;max-width:86%;width:100%}
.task .hd{display:flex;gap:8px;align-items:center;font-size:13px}.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--line)}
.task .st{margin-left:auto;font-size:12px;color:var(--mut)}.task .out{white-space:pre-wrap;margin-top:8px}
.task details{margin-top:6px;font-size:12px;color:var(--mut)}.task details div{padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mut);margin:0 2px;animation:t 1.2s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes t{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.sys{text-align:center;font-size:12px;color:var(--mut);margin:8px 0}
footer{padding:12px 20px 20px}.box{max-width:760px;margin:0 auto;display:flex;gap:8px;border:1px solid var(--line);border-radius:24px;padding:6px 6px 6px 16px;background:var(--bg)}
.box input{flex:1;border:0;outline:0;background:transparent;color:var(--fg);font:inherit}.box button{border:0;border-radius:50%;width:36px;height:36px;background:var(--fg);color:var(--bg);cursor:pointer;font-size:16px}
.chips{max-width:760px;margin:0 auto 8px;display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:99px;padding:4px 12px;cursor:pointer;font:inherit;font-size:13px}
.conn{margin-left:auto;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}.conn i{width:8px;height:8px;border-radius:50%;background:#9ca3af}.conn.ok i{background:#22c55e}.conn.bad i{background:#ef4444}
.sform{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;max-width:78%}.sform input{width:100%;margin:8px 0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit}.sform button{border:0;border-radius:99px;padding:5px 14px;margin-right:6px;cursor:pointer;background:var(--fg);color:var(--bg)}.sform button.ghost{background:var(--line);color:var(--fg)}.sform small{color:var(--mut)}
@media(max-width:700px){aside{display:none}}
</style></head><body><a href="/app.html" style="position:fixed;top:6px;right:10px;z-index:9;font-size:12px">登录 / 群聊</a>
<aside><h1>Grok 风格 · Agents</h1><div class="sec">机器人</div><div id="bots"></div></aside>
<main><header><div class="av">总<i class="dot" id="hdot"></i></div><div><div class="nm">总管 Orchestrator</div><div class="ds" id="hds">L1 常驻 · 随时回复</div></div><div class="conn" id="conn"><i></i><span>连接中…</span></div></header>
<div id="thread"><div class="wrap" id="w"></div></div>
<footer><div class="chips" id="chips"></div><div class="box"><input id="in" placeholder="发消息给总管…" autocomplete="off"><button id="go">↑</button></div></footer></main>
<script>
const sid=new URLSearchParams(location.search).get('sid')||sessionStorage.sid||(sessionStorage.sid='s-'+Math.random().toString(36).slice(2,8));sessionStorage.sid=sid;
const $=s=>document.querySelector(s),W=$('#w'),T=$('#thread');
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const down=()=>T.scrollTop=T.scrollHeight;
let typing=null;
function showTyping(on){if(on&&!typing){typing=document.createElement('div');typing.className='row bot';typing.innerHTML='<div class="av">总</div><div class="b typing"><span></span><span></span><span></span></div>';W.append(typing);down()}if(!on&&typing){typing.remove();typing=null}$('#hdot').className='dot'+(on?' busy':'')}
function bubble(who,text,images){showTyping(false);const r=document.createElement('div');r.className='row '+who;r.innerHTML=(who==='bot'?'<div class="av">总</div>':'')+`<div class="b">${esc(text)}${(images||[]).map(u=>`<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" style="display:block;max-width:100%;margin-top:8px;border-radius:8px;border:1px solid #ddd"></a>`).join('')}</div>`;W.append(r);down()}
function sys(t){const d=document.createElement('div');d.className='sys';d.textContent=t;W.append(d);down()}
fetch('/api/agents').then(r=>r.json()).then(as=>{const bs=Object.values(as).map(a=>({name:'总管 '+a.name,desc:'Mastra on Cloudflare · '+a.provider+'/'+a.modelId}));$('#bots').innerHTML=bs.map((b,i)=>`<div class="item ${i?'':'on'}"><div class="av">总<i class="dot"></i></div><div><div class="nm">${esc(b.name)}</div><div class="ds">${esc(b.desc)}</div></div></div>`).join('');$('#hds').textContent=bs[0].desc;conn('ok','已连接')}).catch(()=>conn('bad','离线'));
function conn(state,label){const c=$('#conn');c.className='conn '+state;c.querySelector('span').textContent=label}
let bg=false;function setStatus(e){bg=e.phase==='background'||(bg&&e.phase!=='idle'&&e.busy);$('#hds').textContent=e.phase==='background'?'后台处理中 · 你可以继续聊':e.phase==='l1-composing'?'正在整理结果…':'L1 常驻 · 随时回复';if(e.phase==='l1-composing')showTyping(true);if(e.phase==='idle'||e.phase==='background')$('#hdot').className='dot'+(e.phase==='background'?' busy':'')}
// HITL 密码表单（stub）：明文只 POST 到 /api/secret，不进聊天记录、不进模型
function secretForm(e){showTyping(false);const r=document.createElement('div');r.className='row bot';r.innerHTML=`<div class="av">总</div><form class="sform"><b>🔒 ${esc(e.label)}</b><br><small>${esc(e.purpose)}</small><input type="password" autocomplete="off" placeholder="仅提交到服务器，不会出现在对话中"><button>提交</button><button type="button" class="ghost">取消</button></form>`;const f=r.querySelector('form'),post=b=>fetch('/api/secret',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({toolCallId:e.toolCallId,runId:e.runId,sessionId:sid,...b})}).then(()=>{f.innerHTML='<small>'+(b.cancel?'已取消':'✓ 已安全提交')+'</small>';showTyping(true)});f.onsubmit=ev=>{ev.preventDefault();post({value:f.querySelector('input').value})};f.querySelector('.ghost').onclick=()=>post({cancel:true});W.append(r);down()}
sys('会话 '+sid+' · 刷新或带 ?sid= 可续聊（记忆存 D1）');
async function send(x){const q=(x??$('#in').value).trim();if(!q)return;$('#in').value='';bubble('me',q);showTyping(true);
 try{const r=await fetch('/api/agents/orchestrator/stream',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:q}],memory:{thread:sid,resource:'web-'+sid}})});
  if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,200));
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',txt='',el=null;
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
   while((i=buf.indexOf('\n'))>=0){let line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(line.startsWith('data:'))line=line.slice(5).trim();if(!line||line==='[DONE]')continue;
    let ev;try{ev=JSON.parse(line)}catch{continue}
    if(ev.type==='text-delta'){txt+=ev.payload?.text??ev.textDelta??'';if(!el){bubble('bot','');el=W.lastElementChild.querySelector('.b')}el.textContent=txt;down()}
    else if(ev.type==='error'){sys('⚠️ '+JSON.stringify(ev.payload??ev).slice(0,200))}}}
  showTyping(false);if(!txt)sys('（空回复）')}catch(err){showTyping(false);sys('⚠️ '+err.message)}}
// P2：轮询后台结果（Worker 无常驻 SSE；/l2-results 自定义路由无 /api 前缀）
async function poll(){try{const r=await fetch('/l2-results?thread='+encodeURIComponent(sid));if(r.ok){const j=await r.json();setStatus({phase:j.busy?'background':'idle',busy:j.busy});(j.results||[]).forEach(x=>bubble('bot',x.text))}}catch{}setTimeout(poll,4000)}poll();
$('#go').onclick=()=>send();$('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)send()};
['帮我统计当前目录有多少文件并写一个 hello.txt','你好，还在吗？','补充: 顺便告诉我 hello.txt 的字节数','查进度','在本地跑：列出 node 版本','在本地帮我做一个咖啡店落地页并截图','我要提供数据库密码'].forEach(c=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>send(c);$('#chips').append(b)});
</script></body></html>
