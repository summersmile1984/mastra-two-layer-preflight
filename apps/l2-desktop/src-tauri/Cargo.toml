[package]
name = "mastra-l2-desktop"
version = "0.2.2"
description = "Mastra Desktop — chat UI + L2 claim runtime"
authors = ["summersmile"]
edition = "2021"

[lib]
name = "mastra_l2_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
